<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESQGRID | AI-Powered Disaster Response Intelligence & Resource Optimization</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050811] text-slate-100 overflow-x-hidden selection:bg-cyan-500 selection:text-black">
    <div id="root">
      <div id="loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #050811; color: #00f0ff; font-family: monospace; text-align: center; padding: 20px;">
        <div style="font-size: 28px; margin-bottom: 12px;">🚨 RESQGRID INITIALIZING...</div>
        <div style="color: #94a3b8; font-size: 14px; max-width: 500px; line-height: 1.6;">
          Connecting to Cognitive Disaster Response Mesh...
        </div>
      </div>
    </div>
    <script>
      // Detect file:// protocol and show helpful prompt
      if (window.location.protocol === 'file:') {
        var el = document.getElementById('loading-fallback');
        if (el) {
          el.innerHTML = '<div style="color: #ff3366; font-size: 24px; font-weight: bold; margin-bottom: 12px;">⚠️ LOCAL DEV SERVER REQUIRED</div>' +
            '<div style="color: #cbd5e1; font-size: 14px; max-width: 600px; line-height: 1.8;">' +
            'Modern 3D WebGL applications with ES modules cannot be opened directly from disk via <code style="color: #00f0ff;">file:///</code>.<br/><br/>' +
            'Please run:<br/>' +
            '<code style="background: #1e293b; padding: 6px 12px; border-radius: 6px; color: #00e676; display: inline-block; margin-top: 8px;">npm run dev</code><br/><br/>' +
            'Then navigate to <a href="http://localhost:5173" style="color: #00f0ff; text-decoration: underline;">http://localhost:5173</a>.' +
            '</div>';
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
